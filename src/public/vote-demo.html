<!DOCTYPE html>
<html lang="en">
        <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0" />
                <title>Vote Panel Demo</title>
                <link
                        href="https://fonts.googleapis.com/css?family=Quicksand:500,700|Catamaran:900&display=swap"
                        rel="stylesheet"
                />
                <link rel="stylesheet" href="style/vote-demo.css" />
                <script src="https://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.min.js" crossorigin></script>
        </head>
        <body>
                <div id="wrapper">
                        <div id="app">
                                <vote-panel
                                        :game-state="gameState"
                                        :username="username"
                                        @cast-vote="handleVote"
                                ></vote-panel>
                        </div>
                </div>

                <script>
                        function buildVoteSummary(gameState) {
                                const connectedNames = gameState.users.map((u) => u.name);
                                const votesCast = Object.entries(gameState.votes)
                                        .filter(([voter]) => connectedNames.includes(voter))
                                        .reduce((acc, [voter, target]) => {
                                                acc[voter] = target;
                                                return acc;
                                        }, {});
                                const counts = {};
                                Object.values(votesCast).forEach((target) => {
                                        counts[target] = (counts[target] || 0) + 1;
                                });
                                const leaderCount = Object.values(counts).reduce((max, count) => Math.max(max, count), 0);
                                const leaders = leaderCount === 0
                                        ? []
                                        : Object.entries(counts)
                                                  .filter(([, count]) => count === leaderCount)
                                                  .map(([name]) => name);
                                const remaining = Math.max(connectedNames.length - Object.keys(votesCast).length, 0);
                                return {
                                        complete: connectedNames.length > 0 && remaining === 0,
                                        remaining,
                                        counts,
                                        leaders,
                                };
                        }

                        Vue.component('vote-panel', {
                                props: {
                                        gameState: {
                                                type: Object,
                                                required: true,
                                        },
                                        username: {
                                                type: String,
                                                required: true,
                                        },
                                },
                                computed: {
                                        voteSummary() {
                                                return this.gameState.voteSummary || { complete: false, remaining: 0, counts: {}, leaders: [] };
                                        },
                                        myVote() {
                                                return (this.gameState.votes && this.gameState.votes[this.username]) || undefined;
                                        },
                                        resultText() {
                                                if (!this.voteSummary.complete) {
                                                        return '';
                                                }
                                                const leaders = this.voteSummary.leaders || [];
                                                if (leaders.length === 0) {
                                                        return 'No votes were cast this round.';
                                                }
                                                if (leaders.length > 1) {
                                                        return `It\'s a tie between ${leaders.join(', ')}.`;
                                                }
                                                const winner = leaders[0];
                                                if (this.gameState.fakerName) {
                                                        return winner === this.gameState.fakerName
                                                                ? `${winner} was voted out. The fake artist has been found!`
                                                                : `${winner} got the most votes, but the fake artist was ${this.gameState.fakerName}.`;
                                                }
                                                return `${winner} received the most votes.`;
                                        },
                                        showFakerReveal() {
                                                return Boolean(this.voteSummary.complete && this.gameState.fakerName);
                                        },
                                },
                                methods: {
                                        voteCount(name) {
                                                return (this.voteSummary.counts && this.voteSummary.counts[name]) || 0;
                                        },
                                        submitVote(targetUser) {
                                                if (!this.voteSummary.complete) {
                                                        this.$emit('cast-vote', targetUser);
                                                }
                                        },
                                },
                                template: `
                                        <div id="vote-panel">
                                                <div class="stripe">
                                                        <div class="stripe-content wrap">
                                                                <div class="banner">Demo: tap a player to cast the last vote.</div>
                                                                <h2>Vote for the fake artist</h2>
                                                                <div class="normal-text">
                                                                        <p v-if="!voteSummary.complete">
                                                                                Tap a player to cast your vote. {{ voteSummary.remaining }} vote<span v-if="voteSummary.remaining !== 1">s</span>
                                                                                remaining.
                                                                        </p>
                                                                        <p v-else>
                                                                                {{ resultText }}
                                                                        </p>
                                                                </div>
                                                                <div class="vote-options">
                                                                        <button
                                                                                v-for="user in gameState.users"
                                                                                :key="user.name"
                                                                                class="btn secondary"
                                                                                :disabled="voteSummary.complete"
                                                                                :class="{ selected: myVote === user.name }"
                                                                                @click="submitVote(user.name)"
                                                                        >
                                                                                <div class="vote-option-label">{{ user.name }}</div>
                                                                                <div class="vote-count">
                                                                                        {{ voteCount(user.name) }} vote<span v-if="voteCount(user.name) !== 1">s</span>
                                                                                </div>
                                                                        </button>
                                                                </div>
                                                                <div class="tinytext" v-if="myVote">
                                                                        You voted for {{ myVote }}.
                                                                </div>
                                                                <div class="normal-text" v-if="showFakerReveal">
                                                                        <p>The fake artist was <strong>{{ gameState.fakerName }}</strong>.</p>
                                                                </div>
                                                        </div>
                                                </div>
                                        </div>
                                `,
                        });

                        new Vue({
                                el: '#app',
                                data() {
                                        return {
                                                username: 'You',
                                                gameState: {
                                                        users: [
                                                                { name: 'Ava' },
                                                                { name: 'Blake' },
                                                                { name: 'Casey' },
                                                                { name: 'Dana' },
                                                                { name: 'You' },
                                                        ],
                                                        votes: {
                                                                Ava: 'Casey',
                                                                Blake: 'Casey',
                                                                Casey: 'Blake',
                                                                Dana: 'Casey',
                                                        },
                                                        fakerName: 'Casey',
                                                        voteSummary: undefined,
                                                },
                                        };
                                },
                                created() {
                                        this.updateVoteSummary();
                                },
                                methods: {
                                        handleVote(targetUser) {
                                                this.$set(this.gameState.votes, this.username, targetUser);
                                                this.updateVoteSummary();
                                        },
                                        updateVoteSummary() {
                                                this.gameState.voteSummary = buildVoteSummary(this.gameState);
                                        },
                                },
                        });
                </script>
        </body>
</html>
